    // --- Components: Quiz V2.0 ---

      const q = QUESTIONS[currentQ];

      return (

    // --- Main App Component ---
    const App = () => {
      // --- State ---
      const [activeTab, setActiveTab] = useState(Tab.CALCULATOR);
      const [state, setState] = useState({
        age: 30,
        horizon: 25,
        mode: InputMode.BTC,
        returnPct: 15,
        expenseNow: 100000,
        inflationPct: 3,
        btcAmount: 0.10,
        btcPriceTWD: 3000000,
        initialTWD: 600000,
        monthlyContribution: 10000,
      });

      // --- Handlers ---
      const handleChange = (field, value) => {
        setState(prev => ({
          ...prev,
          [field]: typeof value === 'string' ? (Number(value) || 0) : value
        }));
      };

      const handleModeChange = (mode) => {
        setState(prev => ({ ...prev, mode }));
      };

      // --- Calculation Logic ---
      const calculation = useMemo(() => {
        const {
          age, horizon, mode, returnPct, expenseNow,
          inflationPct, btcAmount, btcPriceTWD,
          initialTWD, monthlyContribution
        } = state;

        const principal = mode === InputMode.BTC 
          ? btcAmount * btcPriceTWD 
          : initialTWD;
        
        const rate = returnPct / 100;
        const inflation = inflationPct / 100;

        const rows = [];
        let breakEvenRow = null;

        if (mode === InputMode.BTC) {
          let currentBtc = btcAmount;
          let currentPrice = btcPriceTWD;

          for (let year = 1; year <= horizon; year++) {
            const startPrice = currentPrice;
            const endPrice = startPrice * (1 + rate);
            
            const totalAnnualContribution = monthlyContribution * 12;
            const btcPurchasedThisYear = totalAnnualContribution / startPrice;

            const totalBtcAfterPurchase = currentBtc + btcPurchasedThisYear;
            const valueEnd = totalBtcAfterPurchase * endPrice;
            const valueStart = currentBtc * startPrice; 
            
            const interest = valueEnd - valueStart - totalAnnualContribution;

            currentBtc = totalBtcAfterPurchase;
            currentPrice = endPrice;
            
            const expense = expenseNow * Math.pow(1 + inflation, year - 1);
            const diff = interest - expense;
            const isBreakEven = diff >= 0;

            const row = {
              year,
              age: age + year,
              interest,
              expense,
              valueEnd,
              diff,
              isBreakEven,
              btcHoldings: currentBtc
            };
            
            rows.push(row);
            if (isBreakEven && !breakEvenRow) breakEvenRow = row;
          }
        } else {
          // TWD Mode
          let valuePrev = principal;
          
          for (let year = 1; year <= horizon; year++) {
            const totalAnnualContribution = monthlyContribution * 12;
            const valueEnd = (valuePrev + totalAnnualContribution) * (1 + rate);
            
            const interest = valueEnd - valuePrev - totalAnnualContribution;
            
            const expense = expenseNow * Math.pow(1 + inflation, year - 1);
            const diff = interest - expense;
            const isBreakEven = diff >= 0;

            const row = {
              year,
              age: age + year,
              interest,
              expense,
              valueEnd,
              diff,
              isBreakEven
            };

            rows.push(row);
            valuePrev = valueEnd;
            if (isBreakEven && !breakEvenRow) breakEvenRow = row;
          }
        }

        return { principal, rows, breakEvenRow };
      }, [state]);

      // --- Formatters ---
      const fmt = (n) => new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 }).format(n);
      const fmtBtc = (n) => new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 }).format(n);

      // --- Export CSV ---
      const handleExport = () => {
        const isBtc = state.mode === InputMode.BTC;
        const header = ['年', '年齡', '年利息(TWD)', '當年生活費(TWD)', '期末資產(TWD)', '差額'];
        if (isBtc) header.splice(2, 0, '持有BTC(顆)');

        const csvContent = [
          header.join(','),
          ...calculation.rows.map(r => {

            base.push(Math.round(r.expense).toString());
            base.push(Math.round(r.valueEnd).toString());
            base.push(Math.round(r.diff).toString());
            return base.join(',');
          })
        ].join('\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });

                  {/* Age */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">目前年齡</label>
                    <input 
                      type="number" 
                      value={state.age}
                      onChange={(e) => handleChange('age', e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all font-medium text-slate-900"
                    />
                  </div>

                  {/* Horizon */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">試算年數</label>
                    <input 
                      type="number" 
                      value={state.horizon}
                      onChange={(e) => handleChange('horizon', e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all font-medium text-slate-900"
                    />
                  </div>

                  {/* Mode */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">輸入資金模式</label>
                    <select 
                      value={state.mode}
                      onChange={(e) => handleModeChange(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all font-medium text-slate-900 appearance-none cursor-pointer"
                    >
                      <option value={InputMode.BTC}>以 BTC 數量 + 價格</option>
                      <option value={InputMode.TWD}>以台幣金額</option>
                    </select>
                  </div>

                  {/* Return Rate */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-16 h-16 bg-green-50 rounded-bl-full -mr-4 -mt-4 z-0"></div>
                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 relative z-10">年化報酬率 (%)</label>
                    <div className="relative z-10">
                      <input 
                        type="number" 
                        step="0.1"
                        value={state.returnPct}
                        onChange={(e) => handleChange('returnPct', e.target.value)}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition-all font-bold text-green-700"
                      />
                    </div>
                  </div>
                </div>

                {/* Financials Grid */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                  {/* Expense */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">目前年生活費 (TWD)</label>
                    <input 
                      type="number"
                      value={state.expenseNow}
                      onChange={(e) => handleChange('expenseNow', e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all font-medium text-slate-900"
                    />
                  </div>

                  {/* Inflation */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">年通膨率 (%)</label>
                    <input 
                      type="number"
                      step="0.1"
                      value={state.inflationPct}
                      onChange={(e) => handleChange('inflationPct', e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-all font-medium text-red-600"
                    />
                  </div>

                  {/* Principal Calculation Display */}
                  <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-sm text-white flex flex-col justify-between">
                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">初始本金 (試算)</label>
                    <div className="flex items-end justify-between">
                      <span className="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300 font-mono">{state.mode}</span>
                      <div className="text-2xl font-bold tracking-tight">
                        <span className="text-sm text-slate-400 font-normal mr-1">TWD</span>
                        {fmt(calculation.principal)}
                      </div>
                    </div>
                    <div className="mt-2 text-[10px] text-slate-500">
                      {state.mode === InputMode.BTC ? '依「顆數 × 單價」自動換算' : '手動輸入之金額'}
                    </div>
                  </div>
                </div>

                {/* Capital Input Section (Initial + DCA) */}
                <h3 className="text-sm font-bold text-slate-500 mb-3 flex items-center gap-2">
                  <Wallet size={16} />
                  資金投入設定
                </h3>
                
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                  
                  {/* Mode Specific Initial Input */}
                  {state.mode === InputMode.BTC ? (
                    <>
                      <div className="bg-orange-50 p-5 rounded-2xl border border-orange-100 shadow-sm">
                        <label className="block text-xs font-semibold text-orange-800/70 uppercase tracking-wider mb-2">初始持有 BTC 數量</label>
                        <input 
                          type="number"
                          step="0.01"
                          value={state.btcAmount}
                          onChange={(e) => handleChange('btcAmount', e.target.value)}
                          className="w-full px-3 py-2 bg-white border border-orange-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 transition-all font-bold text-slate-900"
                        />
                      </div>
                      <div className="bg-orange-50 p-5 rounded-2xl border border-orange-100 shadow-sm">
                        <label className="block text-xs font-semibold text-orange-800/70 uppercase tracking-wider mb-2">BTC 單價 (TWD)</label>
                        <input 
                          type="number"
                          value={state.btcPriceTWD}
                          onChange={(e) => handleChange('btcPriceTWD', e.target.value)}
                          className="w-full px-3 py-2 bg-white border border-orange-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 transition-all font-medium text-slate-900"
                        />
                      </div>
                    </>
                  ) : (
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm md:col-span-2">
                      <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">初始投入金額 (TWD)</label>
                      <input 
                        type="number"
                        value={state.initialTWD}
                        onChange={(e) => handleChange('initialTWD', e.target.value)}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all font-medium text-slate-900"
                      />
                    </div>
                  )}

                  {/* DCA Input */}
                  <div className="bg-sky-50 p-5 rounded-2xl border border-sky-100 shadow-sm md:col-span-2">
                    <label className="block text-xs font-semibold text-sky-700/70 uppercase tracking-wider mb-2 flex items-center gap-1">
                      每月定投金額 (TWD)
                      <span className="bg-sky-200 text-sky-800 text-[10px] px-1.5 py-0.5 rounded-full">NEW</span>
                    </label>
                    <div className="flex gap-2 items-center">
                      <input 
                        type="number"
                        value={state.monthlyContribution}
                        onChange={(e) => handleChange('monthlyContribution', e.target.value)}
                        className="w-full px-3 py-2 bg-white border border-sky-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all font-medium text-slate-900"
                      />
                      <div className="text-xs text-sky-600/60 min-w-[60px] leading-tight">
                        {state.mode === InputMode.BTC ? '自動換算累計 BTC' : '每月持續買入'}
                      </div>
                    </div>
                  </div>

                </div>

                <div className="border-t border-slate-200 my-8"></div>

                {/* Results Summary */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                  {/* Break Even Box */}
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-lg shadow-slate-100 overflow-hidden relative">
                    <div className={`h-1 w-full absolute top-0 left-0 ${calculation.breakEvenRow ? 'bg-emerald-500' : 'bg-slate-300'}`}></div>
                    <div className="p-6">
                      <div className="flex items-center gap-2 mb-3">
                        <div className={`p-1.5 rounded-lg ${calculation.breakEvenRow ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}`}>
                          <TrendingUp size={18} />
                        </div>
                        <h3 className="text-sm font-bold text-slate-700">財務自由突破年份</h3>
                      </div>
                      
                      {calculation.breakEvenRow ? (
                        <>
                          <div className="text-3xl font-extrabold text-slate-900 mb-1">
                            第 {calculation.breakEvenRow.year} 年
                            <span className="text-lg text-slate-500 font-medium ml-2">({calculation.breakEvenRow.age} 歲)</span>
                          </div>
                          <div className="space-y-1 mt-4">
                            <div className="flex justify-between text-xs text-slate-500">
                              <span>當年利息收入 (含增值)</span>
                              <span className="font-semibold text-emerald-600">TWD {fmt(calculation.breakEvenRow.interest)}</span>
                            </div>
                            <div className="flex justify-between text-xs text-slate-500">
                              <span>當年生活費</span>
                              <span className="font-semibold text-red-500">TWD {fmt(calculation.breakEvenRow.expense)}</span>
                            </div>
                          </div>
                        </>
                      ) : (
                        <div className="text-slate-400 py-4">
                          <p className="text-xl font-semibold">尚未達成</p>
                          <p className="text-sm mt-1">試著增加本金、提高報酬率或延長年限。</p>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Year 1 Reference */}
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                    <h3 className="text-sm font-bold text-slate-700 mb-4 flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-slate-400"></span>
                      第 1 年參考數據
                    </h3>
                    {calculation.rows.length > 0 && (
                      <div className="space-y-4">
                        <div className="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
                          <span className="text-sm text-slate-500">預估利息</span>
                          <span className="text-base font-bold text-slate-900">{fmt(calculation.rows[0].interest)}</span>
                        </div>
                        <div className="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
                          <span className="text-sm text-slate-500">生活費</span>
                          <span className="text-base font-bold text-slate-900">{fmt(calculation.rows[0].expense)}</span>
                        </div>
                        <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                          <span className="text-sm text-slate-500">差額</span>
                          <span className={`text-lg font-extrabold ${calculation.rows[0].diff >= 0 ? 'text-emerald-600' : 'text-red-500'}`}>
                            {calculation.rows[0].diff > 0 ? '+' : ''}{fmt(calculation.rows[0].diff)}
                          </span>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Action Card */}
                  <div className="bg-slate-50 rounded-2xl border border-slate-200 border-dashed p-6 flex flex-col items-center justify-center text-center">
                    <div className="mb-4 text-slate-400">
                      <Download size={32} className="mx-auto mb-2 opacity-50" />
                      <p className="text-xs max-w-[200px]">下載 CSV 格式的詳細逐年數據 (含累積資產明細)</p>
                    </div>
                    <button 
                      onClick={handleExport}
                      className="w-full py-3 px-4 bg-white border border-slate-300 hover:border-slate-400 text-slate-700 font-semibold rounded-xl shadow-sm hover:shadow transition-all flex items-center justify-center gap-2"
                    >
                      <Download size={16} />
                      匯出 CSV 報表
                    </button>
                  </div>
                </div>

                {/* Chart Section */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-lg shadow-slate-100/50 p-6 mb-8">
                  <h3 className="text-lg font-bold text-slate-800 mb-6">資產增長趨勢</h3>
                  <ResultChart data={calculation.rows} />
                </div>

                {/* Table Section */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="p-6 border-b border-slate-100">
                    <h3 className="text-lg font-bold text-slate-800">詳細數據表</h3>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-slate-600">
                      <thead className="bg-slate-50 text-xs uppercase font-semibold text-slate-500">
                        <tr>
                          <th className="px-6 py-4">年</th>
                          <th className="px-6 py-4">年齡</th>
                          {state.mode === InputMode.BTC && (
                            <th className="px-6 py-4 text-orange-600 flex items-center gap-1">
                              <Coins size={14} />
                              持有 BTC (顆)
                            </th>
                          )}
                          <th className="px-6 py-4 text-right">年利息 (TWD)</th>
                          <th className="px-6 py-4 text-right">當年生活費 (TWD)</th>
                          <th className="px-6 py-4 text-right">
                            <div className="flex items-center justify-end gap-1 group/header cursor-help">
                              <span>期末資產 (TWD)</span>
                              <div className="relative">
                                <AlertCircle size={14} className="text-slate-400 hover:text-slate-600 transition-colors" />
                                <div className="absolute right-0 top-full mt-2 w-64 p-3 bg-slate-900 text-slate-50 text-xs rounded-lg shadow-xl opacity-0 invisible group-hover/header:opacity-100 group-hover/header:visible transition-all z-20 font-normal text-left tracking-normal">
                                  {state.mode === InputMode.BTC ? (
                                    <div>
                                      <div className="font-bold text-orange-300 mb-1">BTC 模式計算方式</div>
                                      <div>總資產 ＝ (累積持有顆數) × (年末單價)</div>
                                      <div className="mt-1 text-slate-400 border-t border-slate-700 pt-1">
                                        為方便快速估算，假設每月定投金額於「年初一次性投入」，故整年定投總額皆享有完整的年度漲幅。
                                      </div>
                                    </div>
                                  ) : (
                                    <div>
                                      <div className="font-bold text-sky-300 mb-1">台幣模式計算方式</div>
                                      <div>總資產 ＝ (上期餘額 ＋ 年定投總額) × (1 ＋ 年化報酬率)</div>
                                      <div className="mt-1 text-slate-400 border-t border-slate-700 pt-1">
                                        為方便快速估算，假設每月定投金額於「年初一次性投入」，故整年定投總額皆享有完整的年度複利。
                                      </div>
                                    </div>
                                  )}
                                  <div className="absolute bottom-full right-1 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-b-[6px] border-b-slate-900"></div>
                                </div>
                              </div>
                            </div>
                          </th>
                          <th className="px-6 py-4 text-right">差額</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {calculation.rows.map((row) => (
                          <tr 
                            key={row.year} 
                            className={`hover:bg-slate-50 transition-colors ${row.isBreakEven && row.year === calculation.breakEvenRow?.year ? 'bg-emerald-50/60' : ''}`}
                          >
                            <td className="px-6 py-4 font-medium text-slate-900">
                              {row.year}
                              {row.isBreakEven && row.year === calculation.breakEvenRow?.year && (
                                <span className="ml-2 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-emerald-100 text-emerald-800">
                                  達成
                                </span>
                              )}
                            </td>
                            <td className="px-6 py-4">{row.age}</td>
                            
                            {state.mode === InputMode.BTC && (
                              <td className="px-6 py-4 font-mono text-orange-600 font-semibold">
                                {fmtBtc(row.btcHoldings || 0)}
                              </td>
                            )}

                            <td className="px-6 py-4 text-right font-medium text-sky-600">{fmt(row.interest)}</td>
                            <td className="px-6 py-4 text-right text-slate-500">{fmt(row.expense)}</td>
                            <td className="px-6 py-4 text-right text-slate-900 font-medium">{fmt(row.valueEnd)}</td>
                            <td className={`px-6 py-4 text-right font-bold ${row.diff >= 0 ? 'text-emerald-600' : 'text-red-500'}`}>
                              {row.diff > 0 ? '+' : ''}{fmt(row.diff)}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            <DonationSection />
            
            <footer className="mt-12 text-center text-xs text-slate-400 pb-8">
              <p className="mb-2">
                <b>說明</b>：利息＝期末資產 - 期初資產 - 當年投入本金；生活費＝現在生活費×(1+通膨)^(年數-1)。
              </p>
              <p className="mb-2">
                定投計算採用簡化算法：假設每月定投金額於「年初一次性投入」，直接享有整年完整複利。
              </p>
              <p>本工具為教育試算，未含稅務、費用、風險與價格波動，不構成投資建議。</p>
              <p className="mt-4 opacity-50">© 2024 Investor Fuji</p>
            </footer>

          </main>
        </div>
      );
    };

    // --- Initialization ---
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
